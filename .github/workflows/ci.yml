# CI pipeline per 05-cicd §2 — quality gates for every PR.
#
# Deviations (recorded in the worklog):
# - Preview deploys + LHCI-against-CDN are deferred until AWS (S3/CloudFront/
#   OIDC) is provisioned — LHCI currently audits the built dist served
#   locally by @lhci/cli.
# - INP is a field metric; the lab proxy asserted here is TBT ≤ 200ms.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: format + lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: build + size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size
      # The three brand bans, checked against what actually ships
      # (ADR-017). stylelint only ever saw authored CSS, which is how
      # neutral grey and pure black reached a page in August through
      # runtime-injected markup — and it cannot see generated utilities
      # at all now that Tailwind emits them (ADR-015).
      - run: pnpm check:guardrails
      # Placeholder copy shipped to production once (review OSV-08) —
      # twelve [draft] markers, one inside a <title>.
      - run: pnpm check:copy
      # Subset fonts trade a perf miss for tofu if copy ever uses a
      # character the woff2 no longer carries (06 §1).
      - run: pnpm check:glyphs
      # Horizontal overflow does not scroll on a phone — the browser
      # shrinks the whole page to fit it (review OSV-13).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:responsive
      # Retained for staging verification + manual prod promote (05 §4).
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 90

  asset-guard:
    name: asset guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-assets.mjs

  lighthouse:
    name: lighthouse budgets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhci-report-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 14
